allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

publicHoistPattern:
  - oxlint
  - '@oxlint/plugins'

catalog:
  '@storybook/svelte-vite': 10.6.7
  '@storybook/addon-svelte-csf': 5.1.6
  '@sveltejs/vite-plugin-svelte': 7.3.1
  svelte: 5.57.3
  svelte-check: 4.7.8
  svelte2tsx: 0.7.63
  '@typescript/native': npm:typescript@7.0.2
  '@tanstack/svelte-query': 6.4.1
  storybook: 10.6.7
  '@storybook/addon-vitest': 10.6.7
  '@vitest/browser-playwright': 5.0.5
  playwright: 1.65.0
  '@vitest/coverage-v8': 5.0.5
  '@types/node': 26.6.6
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  knip: 6.45.1
  typescript: 6.0.3
  vite-plus: 1.4.0
  void: 1.8.0
  wrangler: 4.160.1
  zod: 4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
