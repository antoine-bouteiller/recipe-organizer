allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

publicHoistPattern:
  - oxlint
  - '@oxlint/plugins'

catalog:
  '@storybook/svelte-vite': 10.6.3
  '@storybook/addon-svelte-csf': 5.1.5
  '@sveltejs/vite-plugin-svelte': 7.3.1
  svelte: 5.57.2
  svelte-check: 4.7.7
  svelte2tsx: 0.7.62
  '@typescript/native': npm:typescript@7.0.2
  '@tanstack/svelte-query': 6.3.5
  storybook: 10.6.3
  '@storybook/addon-vitest': 10.6.3
  '@vitest/browser-playwright': 5.0.3
  playwright: 1.64.1
  '@vitest/coverage-v8': 5.0.3
  '@types/node': 25.9.9
  drizzle-kit: 1.0.0-rc.3
  drizzle-orm: 1.0.0-rc.3
  knip: 6.42.1
  typescript: 6.0.3
  vite-plus: 1.1.0
  void: 1.1.12
  wrangler: 4.151.2
  zod: 4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
