allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

publicHoistPattern:
  - oxlint
  - '@oxlint/plugins'

catalog:
  '@storybook/react-vite': 10.6.0
  '@storybook/svelte-vite': 10.6.0
  '@storybook/addon-svelte-csf': 5.1.5
  '@sveltejs/vite-plugin-svelte': 7.3.1
  svelte: 5.57.1
  svelte-check: 4.7.6
  '@typescript/native': npm:typescript@7.0.2
  '@void/svelte': 0.23.0
  storybook: 10.6.0
  '@storybook/addon-vitest': 10.6.0
  '@vitest/browser-playwright': 5.0.1
  playwright: 1.63.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@vitest/coverage-v8': 5.0.1
  '@vanilla-extract/css': 1.21.2
  '@vanilla-extract/recipes': 0.5.7
  '@vanilla-extract/vite-plugin': 5.2.6
  '@types/node': 25.9.9
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  drizzle-kit: 1.0.0-rc.3
  drizzle-orm: 1.0.0-rc.3
  knip: 6.39.0
  oxc-transform-react: 0.152.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  vite-plus: 1.0.0
  void: 0.23.0
  '@void/react': 0.23.0
  wrangler: 4.147.0
  zod: 4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAgeExclude:
  - '@void/deploy-cloudflare@0.23.0'
  - '@void/deploy-core@0.23.0'
  - '@void/edge@0.23.0'
  - '@void/isr@0.23.0'
  - '@void/platform@0.23.0'
  - void@0.23.0
  - '@void/react@0.23.0'
  - '@void/svelte@0.23.0'
