packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  '@parcel/watcher': false
  lefthook: true
  sharp: false
  workerd: false

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

publicHoistPattern:
  - oxlint
  - '@oxlint/plugins'

catalog:
  '@storybook/react-vite': 10.6.0
  storybook: 10.6.0
  '@storybook/addon-vitest': 10.6.0
  '@vitest/browser-playwright': 5.0.1
  playwright: 1.63.0
  '@base-ui/react': 1.8.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@vitest/coverage-v8': 5.0.1
  '@hono/zod-validator': 0.9.1
  '@vanilla-extract/css': 1.21.2
  '@vanilla-extract/recipes': 0.5.7
  '@vanilla-extract/vite-plugin': 5.2.6
  '@tanstack/react-form': 1.33.5
  '@tanstack/react-query': 5.103.2
  '@tanstack/react-router': 1.170.39
  '@tanstack/react-store': 0.11.1
  '@tanstack/router-plugin': 1.168.40
  '@types/node': 25.9.8
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  better-auth: 1.7.6
  drizzle-kit: 1.0.0-rc.3
  drizzle-orm: 1.0.0-rc.3
  hono: 4.13.9
  knip: 6.38.0
  lefthook: 2.1.14
  oxc-transform-react: 0.151.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite-plus: 1.0.0-rc.0
  wrangler: 4.141.0
  zod: 4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
