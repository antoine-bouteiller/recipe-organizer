name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/**/*
      - packages/**/*
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/deploy-production.yaml

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-checks:
    name: Quality Checks
    secrets: inherit
    uses: ./.github/workflows/quality-checks.yaml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality-checks
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build project
        run: vpr build
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: apps/api
          command: deploy dist/index.js --config wrangler.jsonc --no-bundle --keep-vars --var VITE_PUBLIC_URL:${{ vars.VITE_PUBLIC_URL }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Migrate Database
        run: vp run db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
