name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - routes/**/*
      - middleware/**/*
      - public/**/*
      - index.html
      - env*.ts
      - void.config.ts
      - void.lock.json
      - vite.config.ts
      - tsconfig.json
      - drizzle.config.ts
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/deploy-production.yaml

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-checks:
    name: Quality Checks
    secrets: inherit
    uses: ./.github/workflows/quality-checks.yaml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality-checks
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp build

      # Wrangler instead of `void deploy`, which would apply Void-managed D1 migrations; drizzle-kit owns them.
      - name: Deploy to Cloudflare Workers
        run: vp exec wrangler deploy --config dist/ssr/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Migrate Database
        run: vp run db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
